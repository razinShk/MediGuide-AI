[build]
  command = "npm run build"
  publish = "dist"

# Proxy Replicate API to prevent browser CORS errors
[[redirects]]
  from = "/api/replicate/*"
  to = "https://api.replicate.com/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
